<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40" role="img" aria-label="AUDI">
  <title>AUDI</title>
  <!--
    For the navy sign-in panel. The A keeps its blues, which hold up against
    the navy, but the lens and the wordmark invert to white — in the dark-navy
    original they sat one shade off the background and vanished.
  -->
  <defs>
    <linearGradient id="hdr-inv-a" x1="8" y1="4" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>
  <path d="M20 5 8.5 35" fill="none" stroke="url(#hdr-inv-a)" stroke-width="7" stroke-linecap="round"/>
  <path d="M20 5 31.5 35" fill="none" stroke="#4D8BFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="15.5" cy="26.5" r="7.2" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="m12.3 26.7 2.4 2.4 4.3-4.8" fill="none" stroke="#fff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m20.9 31.9 2.8 2.8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>

  <text x="46" y="29" fill="#fff"
        font-family="Poppins, Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="500" letter-spacing="3.5">AUDI</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="AUDI">
  <title>AUDI</title>
  <defs>
    <linearGradient id="audi-a" x1="8" y1="4" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!--
    Tuned for the 30px badge in the header, not for the poster. Everything here
    is one step heavier than the drawing looks like it wants: at 22 CSS pixels a
    2px stroke and a 5px lens turn into a smudge, and the mark has to survive
    being small far more often than it has to survive being large.
  -->
  <path d="M20 5 8.5 35" fill="none" stroke="url(#audi-a)" stroke-width="7" stroke-linecap="round"/>
  <path d="M20 5 31.5 35" fill="none" stroke="#2F6BFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="15.5" cy="26.5" r="7.2" fill="none" stroke="#0C2D4A" stroke-width="3"/>
  <path d="m12.3 26.7 2.4 2.4 4.3-4.8" fill="none" stroke="#0C2D4A" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m20.9 31.9 2.8 2.8" fill="none" stroke="#0C2D4A" stroke-width="3.4" stroke-linecap="round"/>
</svg>
